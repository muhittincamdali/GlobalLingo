<text class="t" x="20" y="105" style="animation-delay:2.97s"><tspan fill="#FFFFFF" font-weight="700">GlobalLingo 2.0.0</tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#8FA3BC">·</tspan><tspan fill="#D0E2F7"> fixtures/flutter-arb</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:3.00s"></text>
<text class="t" x="20" y="143" style="animation-delay:3.04s"><tspan fill="#D0E2F7">  </tspan><tspan fill="#FFFFFF" font-weight="700">lib/l10n/*.arb</tspan><tspan fill="#D0E2F7">  </tspan><tspan fill="#8FA3BC">ARB, ICU · source en · 5 keys</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:3.07s"><tspan fill="#D0E2F7">    de 100% · pl 100% · tr 80%</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:3.11s"></text>
<text class="t" x="20" y="200" style="animation-delay:3.14s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">FMT001</tspan><tspan fill="#D0E2F7">  lib/l10n/app_de.arb:4  </tspan><tspan fill="#8FA3BC">Placeholder mismatch</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:3.18s"><tspan fill="#D0E2F7">         "booksOnShelf" in German (de) uses {regal}, which the source text does not have</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:3.21s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Use the placeholder names of the template message; every placeholder needs a</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:3.25s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">declaration in the template's "@key" metadata.</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.28s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#fmt001</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:3.32s"></text>
<text class="t" x="20" y="314" style="animation-delay:3.35s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">FMT002</tspan><tspan fill="#D0E2F7">  lib/l10n/app_de.arb:4  </tspan><tspan fill="#8FA3BC">Placeholder dropped</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.39s"><tspan fill="#D0E2F7">         "booksOnShelf" in German (de) leaves out {shelf} of the source text</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:3.42s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the placeholder to the translation. Plural forms for one or two items may leave</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.46s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">out the number on purpose; this rule does not report those.</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.49s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#fmt002</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.53s"></text>
<text class="t" x="20" y="428" style="animation-delay:3.56s"><tspan fill="#4DA3FF" font-weight="700">INFO    </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">KEY003</tspan><tspan fill="#D0E2F7">  lib/l10n/app_en.arb:28  </tspan><tspan fill="#8FA3BC">Unused key</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:3.60s"><tspan fill="#D0E2F7">         "syncFailed" is not mentioned in any source file</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:3.63s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Delete the message from every ARB file, or ignore it in .globallingo.json if it is</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.67s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">used outside lib/.</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.71s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#key003</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.74s"></text>
<text class="t" x="20" y="542" style="animation-delay:3.77s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">PLU001</tspan><tspan fill="#D0E2F7">  lib/l10n/app_pl.arb:4  </tspan><tspan fill="#8FA3BC">Missing plural form</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.81s"><tspan fill="#D0E2F7">         "booksOnShelf" in Polish (pl) has no plural forms for few (e.g. 2, 3, 4), many (e.g. 0, 5,</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:3.84s"><tspan fill="#D0E2F7">         6)</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:3.88s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the missing category to the plural in this locale's message, e.g. few{…}.</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:3.92s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#plu001</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:3.95s"></text>
<text class="t" x="20" y="656" style="animation-delay:3.98s"><tspan fill="#4DA3FF" font-weight="700">INFO    </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">MIS004</tspan><tspan fill="#D0E2F7">  lib/l10n/app_pl.arb:6  </tspan><tspan fill="#8FA3BC">Same as the source</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:4.02s"><tspan fill="#D0E2F7">         The Polish (pl) translation of "deleteAll" is the same as the source text</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:4.05s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Translate it, or ignore the key in .globallingo.json when the text is the same in both</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:4.09s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">languages (brand names, "OK").</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:4.13s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#mis004</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.16s"></text>
<text class="t" x="20" y="770" style="animation-delay:4.20s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">MIS001</tspan><tspan fill="#D0E2F7">  lib/l10n/app_tr.arb  </tspan><tspan fill="#8FA3BC">Missing translation</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:4.23s"><tspan fill="#D0E2F7">         "syncFailed" has no Turkish (tr) translation</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.26s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the key to this locale's ARB file. Until then gen_l10n uses the template's message</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:4.30s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">for it.</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.33s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#mis001</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:4.37s"></text>
<text class="t" x="20" y="884" style="animation-delay:4.40s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">HCS001</tspan><tspan fill="#D0E2F7">  lib/main.dart:16  </tspan><tspan fill="#8FA3BC">Hard-coded UI text</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.44s"><tspan fill="#D0E2F7">         "Bookshelf" is shown to the user but is not localized</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:4.47s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the text to the template ARB file and read it through the generated class, e.g.</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:4.51s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">AppLocalizations.of(context)!.title.</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:4.54s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#hcs001</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:4.58s"></text>
<text class="t" x="20" y="998" style="animation-delay:4.62s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">TRI003</tspan><tspan fill="#D0E2F7">  lib/main.dart:49  </tspan><tspan fill="#8FA3BC">Translated text cased without the locale</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:4.65s"><tspan fill="#D0E2F7">         Translated text is changed with toUpperCase(), which ignores the locale; Turkish and</tspan></text>
<text class="t" x="20" y="1036" style="animation-delay:4.68s"><tspan fill="#D0E2F7">         Azerbaijani need İ and ı</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:4.72s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Dart's toUpperCase() ignores the locale. Put the upper-case text in the ARB file as</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:4.75s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">its own message, so the Turkish translator writes İ.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:4.79s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#tri003</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:4.83s"></text>
<text class="t" x="20" y="1131" style="animation-delay:4.86s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">HCS001</tspan><tspan fill="#D0E2F7">  lib/main.dart:51  </tspan><tspan fill="#8FA3BC">Hard-coded UI text</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:4.89s"><tspan fill="#D0E2F7">         "Pull to refresh" is shown to the user but is not localized</tspan></text>
<text class="t" x="20" y="1169" style="animation-delay:4.93s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the text to the template ARB file and read it through the generated class, e.g.</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:4.96s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">AppLocalizations.of(context)!.title.</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:5.00s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#hcs001</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:5.04s"></text>
