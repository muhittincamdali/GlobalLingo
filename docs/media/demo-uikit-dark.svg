<text class="t" x="20" y="105" style="animation-delay:3.06s"><tspan fill="#FFFFFF" font-weight="700">GlobalLingo 2.0.0</tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#8FA3BC">·</tspan><tspan fill="#D0E2F7"> fixtures/uikit-strings</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:3.10s"></text>
<text class="t" x="20" y="143" style="animation-delay:3.13s"><tspan fill="#D0E2F7">  </tspan><tspan fill="#FFFFFF" font-weight="700">Inbox/*.lproj/Localizable</tspan><tspan fill="#D0E2F7">  </tspan><tspan fill="#8FA3BC">strings table, format specifiers · source en · 4 keys</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:3.17s"><tspan fill="#D0E2F7">    de 100% · ru 100% · tr 75%</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:3.20s"></text>
<text class="t" x="20" y="200" style="animation-delay:3.23s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">DUP001</tspan><tspan fill="#D0E2F7">  Inbox/de.lproj/Localizable.strings:7  </tspan><tspan fill="#8FA3BC">Duplicate key</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:3.27s"><tspan fill="#D0E2F7">         "archive.confirm.message" appears again (first on line 6); only one of the two values is</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:3.31s"><tspan fill="#D0E2F7">         used</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:3.34s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Keep one of the two entries, with the right translation, and delete the other.</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.38s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#dup001</tspan></text>
<text class="t" x="20" y="295" style="animation-delay:3.41s"></text>
<text class="t" x="20" y="314" style="animation-delay:3.45s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">HCS001</tspan><tspan fill="#D0E2F7">  Inbox/InboxViewController.swift:17  </tspan><tspan fill="#8FA3BC">Hard-coded UI text</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.48s"><tspan fill="#D0E2F7">         "Archive all" is shown to the user but is not localized</tspan></text>
<text class="t" x="20" y="352" style="animation-delay:3.52s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Use String(localized:) or a localized SwiftUI initializer and add the string to the</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.55s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">String Catalog.</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.58s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#hcs001</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.62s"></text>
<text class="t" x="20" y="428" style="animation-delay:3.66s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">KEY001</tspan><tspan fill="#D0E2F7">  Inbox/InboxViewController.swift:37  </tspan><tspan fill="#8FA3BC">Unknown key</tspan></text>
<text class="t" x="20" y="447" style="animation-delay:3.69s"><tspan fill="#D0E2F7">         "archive.confirm.ok" is not in the Localizable table</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:3.73s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Add the key to the String Catalog or .strings table the lookup names, or correct the</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.76s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">key in the code.</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.79s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#key001</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.83s"></text>
<text class="t" x="20" y="542" style="animation-delay:3.87s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">PLU001</tspan><tspan fill="#D0E2F7">  Inbox/ru.lproj/Localizable.stringsdict:9  </tspan><tspan fill="#8FA3BC">Missing plural form</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.90s"><tspan fill="#D0E2F7">         "inbox.count" in Russian (ru) has no plural forms for "messages" for few (e.g. 2, 3, 4),</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:3.94s"><tspan fill="#D0E2F7">         many (e.g. 0, 5, 6)</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:3.97s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: In the String Catalog editor, add the missing plural form for this locale (Vary by</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:4.00s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Plural shows every category the language uses).</tspan></text>
<text class="t" x="20" y="637" style="animation-delay:4.04s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#plu001</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:4.08s"></text>
<text class="t" x="20" y="675" style="animation-delay:4.11s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">MIS001</tspan><tspan fill="#D0E2F7">  Inbox/tr.lproj/Localizable.strings  </tspan><tspan fill="#8FA3BC">Missing translation</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:4.15s"><tspan fill="#D0E2F7">         "archive.confirm.message" has no Turkish (tr) translation</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:4.18s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Translate the key for this locale in Xcode's String Catalog editor, or add it to the</tspan></text>
<text class="t" x="20" y="732" style="animation-delay:4.21s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">locale's .strings file.</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.25s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#mis001</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:4.29s"></text>
<text class="t" x="20" y="789" style="animation-delay:4.32s"><tspan fill="#8CC4FF" font-weight="700">WARNING </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">STA002</tspan><tspan fill="#D0E2F7">  Inbox/tr.lproj/Localizable.strings:7  </tspan><tspan fill="#8FA3BC">Key not in the source language</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.36s"><tspan fill="#D0E2F7">         "inbox.legacy" is in Turkish (tr) but not in the source language English (en)</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:4.39s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Delete the key from this locale, or add it to the source language if the app uses it.</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.43s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#sta002</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:4.46s"></text>
<text class="t" x="20" y="884" style="animation-delay:4.50s"><tspan fill="#FFFFFF" font-weight="700">ERROR   </tspan><tspan fill="#D0E2F7"> </tspan><tspan fill="#FFFFFF" font-weight="700">FMT001</tspan><tspan fill="#D0E2F7">  Inbox/tr.lproj/Localizable.stringsdict:17  </tspan><tspan fill="#8FA3BC">Placeholder mismatch</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.53s"><tspan fill="#D0E2F7">         "inbox.count" in Turkish (tr) (messages.other) uses %1$d (a 32-bit integer) for argument 1;</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:4.57s"><tspan fill="#D0E2F7">         the source text has %1$#@messages@ (a 64-bit integer)</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:4.60s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">Fix: Use the same format specifiers as the source text, with positions (%1$@, %2$lld) when</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:4.63s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">the order changes.</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:4.67s"><tspan fill="#D0E2F7">         </tspan><tspan fill="#8FA3BC">https://github.com/muhittincamdali/GlobalLingo/blob/master/docs/rules.md#fmt001</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:4.71s"></text>
<text class="t" x="20" y="1017" style="animation-delay:4.74s"><tspan fill="#FFFFFF">✗</tspan><tspan fill="#D0E2F7"> 4 errors, 3 warnings in 1 catalog and 2 source files</tspan></text>
<text class="t" x="20" y="1036" style="animation-delay:4.98s"><tspan fill="#0A84FF" font-weight="700">$ </tspan></text>
